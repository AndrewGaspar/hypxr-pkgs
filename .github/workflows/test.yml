name: Test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream remote
        run: git remote add upstream https://github.com/omacom-io/omarchy-pkgs.git

      - name: Run repository tests
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:base-devel bash -lc '
              pacman -Sy --noconfirm jq ripgrep
              useradd -m builder
              chown -R builder:builder /workspace
              runuser -u builder -- test/run.sh
              runuser -u builder -- bash -lc '\''
                cd /workspace
                for package in pkgbuilds/*; do
                  (cd "$package" && makepkg --printsrcinfo >/dev/null)
                done
              '\''
            '
