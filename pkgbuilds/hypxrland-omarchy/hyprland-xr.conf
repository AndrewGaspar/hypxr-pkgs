# Omarchy XR configuration
#
# HypXRland's OpenXR directives currently require classic hyprlang. These
# defaults are packaged beside Quattro's Lua modules and do not affect the
# ordinary Omarchy session. Adjust the GPU, monitor, and XR placement below for
# this machine.

source = /usr/share/omarchy/default/hypr/autostart.conf
source = /usr/share/omarchy/default/hypr/bindings/media.conf
source = /usr/share/omarchy/default/hypr/bindings/clipboard.conf
source = /usr/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = /usr/share/omarchy/default/hypr/bindings/utilities.conf
source = /usr/share/omarchy/default/hypr/envs.conf
source = /usr/share/omarchy/default/hypr/looknfeel.conf
source = /usr/share/omarchy/default/hypr/input.conf
source = /usr/share/omarchy/default/hypr/windows.conf

# A safe physical-monitor fallback. Replace or supplement it with explicit
# monitor rules when required by the machine.
monitor = , preferred, auto, auto

openxr {
  enabled = 1
  overlay = 1
  hand_input = off
  depth_desktop = 1

  # The OpenXR runtime and compositor must render on the same GPU. Uncomment
  # and adjust after identifying the correct render node.
  # gpu = /dev/dri/renderD128
}

# A usable first monitor that can be repositioned live with the XR controls.
xrmonitor = XR-main, 2560x1440@90, anchor:local pos:0,1.4,-1.5 adaptive:on roam:body, size:2.2
monitor = XR-main, 2560x1440@90, auto, 1.25

exec-once = systemctl --user start wivrn.service
exec-once = hypxrva-watcher

bind = SUPER SHIFT, G, xrmonitor, gazegrab
binde = SUPER ALT, equal, xrmonitor, gazepush 0.1
binde = SUPER ALT, minus, xrmonitor, gazepush -0.1
bind = SUPER ALT, H, xrmonitor, handinput toggle
bindd = SUPER ALT, M, Toggle XR monitor view, xrmonitor, view toggle
bind = SUPER, Home, xrmonitor, center
bind = SUPER SHIFT, X, exec, wivrnctl disconnect
